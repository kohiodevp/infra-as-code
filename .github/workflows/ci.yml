name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_LINT_VERSION: "26.9.0"
  PYTHON_VERSION: "3.12"

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ansible-lint
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            "ansible-lint==${ANSIBLE_LINT_VERSION}"

      - name: Lint Ansible playbooks and roles
        run: ansible-lint --nocolor ansible/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::Aucun script scripts/*.sh a verifier"
            exit 0
          fi
          printf 'Verification de %s script(s)\n' "${#files[@]}"
          shellcheck --external-sources --severity=style "${files[@]}"

  docker-compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialise .env depuis .env.example
        run: cp .env.example .env

      - name: Valider le fichier docker-compose.yml
        run: docker compose --file docker-compose.yml config --quiet
