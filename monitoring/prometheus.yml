global:
  scrape_interval: ${PROMETHEUS_SCRAPE_INTERVAL}
  scrape_timeout: 10s
  evaluation_interval: ${PROMETHEUS_SCRAPE_INTERVAL}

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: netdata
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ['netdata:19999']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ['vault:8200']
